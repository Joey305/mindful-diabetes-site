<figure class="cms-block cms-quote">
  <blockquote>{{ block.content.quote }}</blockquote>
  {% if block.content.author or block.content.role %}
    <figcaption>
      {% if block.content.author %}<strong>{{ block.content.author }}</strong>{% endif %}
      {% if block.content.role %}<span>{{ block.content.role }}</span>{% endif %}
    </figcaption>
  {% endif %}
</figure>
