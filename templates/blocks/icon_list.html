<section class="cms-block cms-icon-list">
  {% if block.content.heading %}<h2>{{ block.content.heading }}</h2>{% endif %}
  <div>
    {% for item in block.content["items"] %}
      <article>
        <span aria-hidden="true">{{ item.icon or "✓" }}</span>
        <h3>{% if item.url %}<a href="{{ item.url }}">{{ item.title }}</a>{% else %}{{ item.title }}{% endif %}</h3>
        {% if item.description %}<p>{{ item.description }}</p>{% endif %}
      </article>
    {% endfor %}
  </div>
</section>
